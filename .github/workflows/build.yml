name: build

# Obraz przebudowujemy takze co tydzien, zeby lataki bezpieczenstwa bazowego
# debiana trafialy do obrazu bez czekania na zmiane w repo.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR wymaga nazw obrazow pisanych mala litera, a wlasciciel repo
      # (Guardly-Enterprise) ma duze — bez tego push do rejestru konczy sie
      # bledem "invalid reference format".
      - id: ns
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/teamspeak6-server" >> "$GITHUB_OUTPUT"

      # Upstream publikuje amd64 i arm64, wiec budujemy oba.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ns.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
